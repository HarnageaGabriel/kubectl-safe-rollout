name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Agreed coverage threshold (see rules/test.md): 75%, a few points below
# actual coverage when it was set (80.0% on internal/..., the only part of the
# code covered by unit tests — the CLI in cmd/ is cobra wiring, tested by e2e
# scenarios when they are available). Raise it only when new code genuinely
# exceeds it.
env:
  COVERAGE_THRESHOLD: "75"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test (all packages)
        run: go test ./...

      - name: Coverage (internal/ only)
        # The coverage gate measures only internal/...: cmd/ is cobra wiring
        # with no domain logic, and in Go 1.26+ a package without test files is
        # still included in the merged profile with 0% of its statements,
        # which would lower the threshold for no reason if calculated on ./...
        # (measured: 80% on internal/... versus 60% on ./... with the same
        # code).
        run: go test ./internal/... -coverprofile=coverage.out -covermode=atomic

      - name: Check coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${total}%  (threshold: ${COVERAGE_THRESHOLD}%)"
          awk -v t="$total" -v th="$COVERAGE_THRESHOLD" 'BEGIN { exit (t+0 >= th+0) ? 0 : 1 }' \
            || { echo "Coverage below the minimum threshold of ${COVERAGE_THRESHOLD}%"; exit 1; }

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  dco:
    name: DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Merge commits are skipped because their sign-off is not required.
      - name: Verify commit sign-offs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failures=()
          while IFS= read -r sha; do
            parents=$(git log -1 --format='%P' "$sha")
            if [ "$(wc -w <<< "$parents")" -gt 1 ]; then
              continue
            fi

            if ! git log -1 --format='%B' "$sha" \
              | git interpret-trailers --parse \
              | grep -qiE '^Signed-off-by:[[:space:]]+.+[[:space:]]+<[^>]+>[[:space:]]*$'; then
              failures+=("$(git log -1 --format='%H %s' "$sha")")
            fi
          done < <(git log --format='%H' "${BASE_SHA}..${HEAD_SHA}")

          if [ "${#failures[@]}" -ne 0 ]; then
            echo "DCO sign-off missing from these commits:"
            printf '  %s\n' "${failures[@]}"
            echo
            echo "Fix the last commit with: git commit --amend -s --no-edit"
            echo "Fix several commits with: git rebase --signoff <base>"
            exit 1
          fi
